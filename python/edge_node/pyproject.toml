[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-node"
version = "0.1.0"
description = "Simulated smoke-detection nodes that post bearing alerts to the firespread serve example"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# D-Fire publishes YOLOv5 weights; the `yolov5` package loads them offline.
yolov5 = ["yolov5", "opencv-python"]
# YOLOv8 / YOLO11 style weights (.pt or exported .onnx).
ultralytics = ["ultralytics", "opencv-python"]

[project.scripts]
edge-node = "edge_node.node:main"
edge-node-sim = "edge_node.simulate:main"

[tool.setuptools.packages.find]
include = ["edge_node*"]
