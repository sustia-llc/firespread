[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
csv = "1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiff = { version = "=0.11.3", default-features = false, features = ["deflate"] }

firespread-fuel = { path = "crates/firespread-fuel" }
firespread-rothermel = { path = "crates/firespread-rothermel" }
