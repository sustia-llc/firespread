[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
csv = "1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
rand = { version = "0.10.3", default-features = false, features = ["std"] }
rand_chacha = { version = "0.10.0", default-features = false, features = ["std"] }
rand_distr = { version = "0.6.0", default-features = false, features = ["std"] }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiff = { version = "=0.11.3", default-features = false, features = ["deflate"] }

kanal = { git = "https://github.com/fereidani/kanal", rev = "89a1a3c75d4d8cdf7d624afd1c593f11da6c0047" }
tokio = { version = "1.54.1", default-features = false }
tokio-rayon = "2.1.0"
tokio-util = { version = "0.7.20", default-features = false }
tracing = "0.1.44"

firespread-agents = { path = "crates/firespread-agents" }
firespread-ensemble = { path = "crates/firespread-ensemble" }
firespread-fuel = { path = "crates/firespread-fuel" }
firespread-grid = { path = "crates/firespread-grid" }
firespread-metrics = { path = "crates/firespread-metrics" }
firespread-rothermel = { path = "crates/firespread-rothermel" }
firespread-spread = { path = "crates/firespread-spread" }
